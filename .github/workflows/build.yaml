name: Build
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    # The flashed satellite firmware is xiao-esp32-s3 (esp32s3, IDF 5.5.4 per
    # dependencies.lock). The upstream job ran idf.py at the repo root, which
    # has no CMakeLists.txt, so it could never pass.
    # Production images are built with PlatformIO's framework-espidf 5.5.4,
    # which comments "-Wall" "-Werror" "-Wextra" out of tools/cmake/build.cmake.
    # Stock espressif/idf:v5.5.4 keeps them and fails ota.cpp on a -Wrestrict
    # false positive (run 36253100920). Apply the same edit so CI compiles
    # exactly what gets flashed.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: I2S role lint (ESP32 must be I2S SLAVE — XVF3800 is clock master)
      run: python3 scripts/i2s_role_lint.py

    - name: ASR routing lint (OP_L must carry clean ASR beam cat-7 + ASROUTONOFF=1)
      run: python3 scripts/asr_routing_lint.py

    - name: Build xiao-esp32-s3 (production dual-stream config)
      run: |
        docker run -v $PWD:/project -w /project/xiao-esp32-s3 -u 0 \
        -e HOME=/tmp -e WIFI_SSID=A -e WIFI_PASSWORD=B \
        -e PIPECAT_SMALLWEBRTC_URL=http://ci.invalid:7860/api/offer \
        -e PIPECAT_DUAL_STREAM=1 \
        espressif/idf:v5.5.4 \
        /bin/bash -c 'sed -i -E "s/^( *)(\"-Wall\"|\"-Werror\"|\"-Wextra\")$/\1# \2/" $IDF_PATH/tools/cmake/build.cmake && \
          test $(grep -cE "^ *# \"-(Wall|Werror|Wextra)\"$" $IDF_PATH/tools/cmake/build.cmake) -eq 3 && \
          idf.py set-target esp32s3 && idf.py build'
      shell: bash

  reproducible:
    # Fleet v2 IMAGE-SHA (t_1d4f0294): one commit must give ONE image sha256, so
    # the manifest can pin firmware.image_sha256 and parity can grade bytes, not
    # the version string. Builds the fleet-image config twice (different abs
    # path, different time, fresh container from the pinned toolchain digest)
    # and fails on any byte difference.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Build twice, diff
      run: bash scripts/repro_build_check.sh "$RUNNER_TEMP/repro"
    - name: Keep both images
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: repro-images
        path: ${{ runner.temp }}/repro/
        if-no-files-found: ignore
